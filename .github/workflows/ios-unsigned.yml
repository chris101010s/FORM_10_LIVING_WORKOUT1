
name: FORM 15.0.0 · Standard iOS IPA
on:
  workflow_dispatch:
    inputs:
      custom_tabs:
        description: Kompatibilitätsmodus mit eigener Tab-Leiste
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'app.config.js'
      - 'assets/**'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'package-lock.json'
      - 'package.json'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'modules/**'
      - 'plugins/**'
      - '.github/workflows/ios-unsigned.yml'

permissions:
  contents: read

concurrency:
  group: form15-standard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone:
    name: Standard · ohne HealthKit und Widgets
    runs-on: xcode-27
    timeout-minutes: 85
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      FORM_HEALTHKIT: '0'
      FORM_WIDGETS: '0'
      EXPO_PUBLIC_FORM_CUSTOM_TABS: ${{ inputs.custom_tabs && '1' || '0' }}

    steps:
      - uses: actions/checkout@v6

      - name: Quelldateien und Git-Tracking früh prüfen
        run: node scripts/preflight.cjs

      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Pillow installieren und prüfen
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow
          python3 -c "from PIL import Image; print('Pillow OK')"

      - name: Xcode-Version protokollieren
        run: xcodebuild -version

      - name: Native Startklassennamen unter Swift prüfen
        run: |
          set -o pipefail
          mkdir -p artifacts
          bash scripts/test-scene-runtime-name.sh | tee artifacts/scene-runtime-status.json

      - name: Frühe Startdiagnose sichern
        uses: actions/upload-artifact@v6
        with:
          name: FORM_15_0_0_Startup_Diagnosis-${{ github.run_number }}
          path: artifacts/scene-runtime-status.json
          if-no-files-found: error
          retention-days: 14

      - name: Reproduzierbare Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Tests, TypeScript, Lint, Expo-Konfiguration und Doctor
        run: npm run qa:release

      - name: Apple Backup-Kryptografie kompilieren und testen
        run: |
          set -o pipefail
          bash scripts/test-apple-crypto.sh 2>&1 | tee artifacts/crypto.log

      - name: Native iOS-Dateien erzeugen
        run: |
          set -o pipefail
          npx --no-install expo prebuild --platform ios --clean --no-install 2>&1 | tee artifacts/prebuild.log

      - name: CocoaPods installieren
        working-directory: ios
        run: |
          set -o pipefail
          pod install 2>&1 | tee ../artifacts/pods.log

      - name: Release-App für die Simulator-Hostarchitektur kompilieren
        timeout-minutes: 25
        run: bash scripts/build-ios-simulator.sh

      - name: Drei Release-Starts und FORM10-Daten im Simulator prüfen
        timeout-minutes: 15
        run: bash scripts/simulator-smoke.sh --skip-build

      - name: Echte iPhone-IPA kompilieren und prüfen
        run: npm run build:ios:unsigned

      - name: Tatsächliche Build- und Prüfprotokolle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: FORM_15_0_0_Standard_QA-${{ github.run_number }}
          path: |
            artifacts/*.log
            artifacts/*status.json
            artifacts/*manifest.json
            artifacts/*.png
            artifacts/*.xcresult
            artifacts/simulator-crashes/**
            artifacts/simulator-smoke/**
          if-no-files-found: warn
          retention-days: 14

      - name: Standard-IPA und SHA-256
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: FORM_15_0_0_unsigned_IPA-${{ github.run_number }}
          path: |
            artifacts/FORM_15_0_0_unsigned.ipa
            artifacts/FORM_15_0_0_unsigned.manifest.json
            artifacts/FORM_15_0_0_unsigned.sha256
            package-lock.json
          if-no-files-found: error
          retention-days: 14
