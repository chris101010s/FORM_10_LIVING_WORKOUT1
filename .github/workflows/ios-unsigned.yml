name: FORM 10.0 – iOS IPA (unsigned)
on:
  workflow_dispatch:
    inputs:
      custom_tabs:
        description: "Kompatibilitätsmodus mit bisheriger GlassBar statt nativer Tab-Leiste"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'app.config.js'
      - 'assets/**'
      - 'tsconfig.json'
      - 'package-lock.json'
      - 'package.json'
      - 'src/**'
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - 'modules/**'
      - '.github/workflows/ios-unsigned.yml'
permissions:
  contents: read
jobs:
  iphone:
    name: iPhone Release App ohne Signatur
    runs-on: xcode-27
    timeout-minutes: 65
    env:
      EXPO_PUBLIC_FORM_CUSTOM_TABS: ${{ inputs.custom_tabs && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Quelldateien und Git-Tracking früh prüfen
        run: node scripts/preflight.cjs
      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
      - name: Verfügbare Xcode-Version anzeigen
        run: xcodebuild -version
      - name: Expo Abhängigkeiten installieren
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Expo Konfiguration prüfen
        run: |
          npx expo config --type public > /tmp/form-expo-config.json
          npx expo install --check
      - name: Offiziellen Übungskatalog abrufen (mit Offline-Fallback)
        run: npm run catalog:fetch
      - name: Lizenzierte Übungsbilder und Schriften vorbereiten
        run: |
          npm run catalog:photos
          npm run assets:fonts
      - name: Tests und TypeScript prüfen
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run check 2>&1 | tee artifacts/check.log
      - name: Apple Kryptografie kompilieren und testen
        run: |
          set -o pipefail
          bash scripts/test-apple-crypto.sh 2>&1 | tee artifacts/crypto.log
      - name: Native iOS Projekt generieren
        run: npx expo prebuild -p ios --clean --no-install
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
      - name: CocoaPods installieren
        run: |
          cd ios
          pod install
      - name: App ohne Apple-Signatur bauen
        run: bash scripts/build-ios-unsigned.sh
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
      - name: Xcode-Fehlerlog bereitstellen
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ATHLETE_OS_Xcode_Fehlerlog
          path: |
            artifacts/xcodebuild.log
            artifacts/check.log
            artifacts/crypto.log
            package-lock.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Unsignierte IPA als Download bereitstellen
        uses: actions/upload-artifact@v6
        with:
          name: ATHLETE_OS_unsigned_IPA-${{ github.run_number }}
          path: |
            artifacts/ATHLETE_OS_unsigned.ipa
            artifacts/release-manifest.json
            package-lock.json
          retention-days: 14
          if-no-files-found: error
